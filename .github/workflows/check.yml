# Runs the project gates (scripts/check.py) on GitHub's machines and keeps the built places, so
# nothing has to be installed locally. Tool versions match rokit.toml; update both together.
# The built Hub.rbxl and Mission.rbxl are attached to each run as the artifact "places".
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned tools (same versions as rokit.toml)
        run: |
          mkdir -p "$HOME/tools"
          cd "$HOME/tools"
          for url in \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip \
            https://github.com/Kampfkarren/selene/releases/download/0.28.0/selene-0.28.0-linux.zip \
            https://github.com/JohnnyMorganz/StyLua/releases/download/v0.20.0/stylua-linux-x86_64.zip \
            https://github.com/lune-org/lune/releases/download/v0.8.9/lune-0.8.9-linux-x86_64.zip
          do
            curl -sSfL -o tool.zip "$url"
            unzip -o -q tool.zip
            rm tool.zip
          done
          chmod +x rojo selene stylua lune
          echo "$HOME/tools" >> "$GITHUB_PATH"

      - name: Gates (rojo build, lune tests, selene, stylua)
        # The report is also posted as an annotation, which anyone can read without signing in.
        run: |
          set +e
          python3 scripts/check.py 2>&1 | tee check.log
          status=${PIPESTATUS[0]}
          report=$(sed -e 's/%/%25/g' check.log | sed -e ':a;N;$!ba;s/\n/%0A/g')
          if [ "$status" -eq 0 ]; then
            echo "::notice title=gates::$report"
          else
            echo "::error title=gates::$report"
          fi
          exit "$status"

      # When formatting is all that is wrong, post the exact fix as annotations, so it can be
      # applied with `git apply` on a machine that has no stylua.
      - name: Post the formatting fix
        if: failure()
        run: |
          stylua src tests lune
          git diff > fmt.patch
          if [ -s fmt.patch ]; then
            python3 - <<'PY'
          text = open("fmt.patch", encoding="utf-8").read()
          size = 30000
          parts = [text[i:i + size] for i in range(0, len(text), size)]
          for index, part in enumerate(parts):
              body = part.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::warning title=fmt.patch {index + 1}/{len(parts)}::{body}")
          PY
          fi

      - name: Keep the built places
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: places
          path: build/*.rbxl
          if-no-files-found: warn
